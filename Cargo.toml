[package]
name = "asciiflow-desktop"
version = "0.1.0"
edition = "2024"
description = "A native ASCII diagram editor built with Rust and GPUI"

[dependencies]
dirs = "5"
gpui = "=0.2.2"
reqwest = { package = "zed-reqwest", version = "=0.12.15-zed", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots"] }
resvg = { version = "0.45.1", default-features = false, features = ["text", "system-fonts"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
uuid = { version = "1", features = ["serde", "v4"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native"] }
security-framework = "2.11.1"

[target.'cfg(target_os = "linux")'.dependencies]
# Newer versions raise the libc floor above GPUI 0.2.2's Linux pin.
dbus-secret-service = "=4.1.0"
keyring = { version = "3.6.3", features = ["sync-secret-service", "crypto-rust", "vendored"] }

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
