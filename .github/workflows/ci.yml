name: Desktop checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-latest]

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: rustup toolchain install 1.100.0 --profile minimal --component rustfmt --component clippy
      - run: rustup default 1.100.0

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake pkg-config \
            libfontconfig1-dev libssl-dev libwayland-dev libx11-xcb-dev \
            libxkbcommon-dev libxkbcommon-x11-dev

      - name: Check the Metal compiler
        if: runner.os == 'macOS'
        run: xcrun metal --version || xcodebuild -downloadComponent MetalToolchain

      - name: Find the Windows shader compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $fxc = Get-ChildItem "${env:ProgramFiles(x86)}/Windows Kits/10/bin/*/x64/fxc.exe" |
            Sort-Object { [version]$_.Directory.Parent.Name } -Descending |
            Select-Object -First 1
          if (!$fxc) { throw 'Install a Windows SDK that includes fxc.exe.' }
          "GPUI_FXC_PATH=$($fxc.FullName)" >> $env:GITHUB_ENV

      - run: cargo fmt --all --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo check --locked --release
